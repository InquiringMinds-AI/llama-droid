[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-droid"
version = "1.0.0"
description = "Local LLM runtime for Android with GPU acceleration and MCP support"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "InquiringMinds-AI", email = "support@inquiringminds.ai"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Android",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["llm", "android", "termux", "llama.cpp", "mcp", "local-ai", "privacy"]
dependencies = []

[project.urls]
Homepage = "https://github.com/InquiringMinds-AI/llama-droid"
Repository = "https://github.com/InquiringMinds-AI/llama-droid"
Issues = "https://github.com/InquiringMinds-AI/llama-droid/issues"

[project.scripts]
llama-droid = "llama_droid.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llama_droid*"]
